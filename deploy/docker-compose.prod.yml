# =============================================================================
# RAM / OOM fixes (the crash: Redis + snapshots + other services fill RAM).
#
# 1. Redis: now capped + snapshots off via deploy/redis.conf (see redis block).
# 2. HOST swap file  -- do this on the VM, biggest single win on a small box:
#      sudo fallocate -l 2G /swapfile && sudo chmod 600 /swapfile
#      sudo mkswap /swapfile && sudo swapon /swapfile
#      echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
# 3. HOST sysctl so Redis bg ops never fail on memory:
#      echo 'vm.overcommit_memory = 1' | sudo tee /etc/sysctl.d/99-redis.conf
#      sudo sysctl -p /etc/sysctl.d/99-redis.conf
# 4. Postgres capped below. Add mem_limit to other services AFTER measuring
#    their real footprint with `docker stats` (too-low a cap OOM-restarts them).
#
# NOTE: postgres kept on pg16 on purpose -- bumping the major breaks the
# existing postgres_data volume (needs pg_upgrade). `latest-pg16` already pulls
# the newest TimescaleDB for PG16.
#
# WARNING: the `frontend` service runs `next build` at every container start
# (see its command). A Next.js build can spike to 1-2 GB RAM -- a likely second
# OOM source. Prefer building the frontend at IMAGE-build time and running only
# `next start` here.
# =============================================================================
services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mydb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    # Load the tuned config (maxmemory + noeviction + snapshots OFF). WITHOUT
    # this, Redis ran with defaults = no memory cap + RDB snapshots on, which is
    # what filled RAM and OOM-killed the box. See deploy/redis.conf.
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Hard container cap just above redis.conf's maxmemory (192mb), leaving room
    # for Redis overhead/fragmentation. Raise both together if you need more.
    mem_limit: 256m
    restart: unless-stopped

  migrate:
    image: jiten56/preps-migrate:latest
    command: sh -c "bunx prisma migrate deploy && bun setup.ts"
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/mydb
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    image: jiten56/preps-backend:latest
    ports:
      - "3000:3000"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/mydb
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  ws:
    image: jiten56/preps-ws:latest
    ports:
      - "9102:9102"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: jiten56/preps-frontend:latest
    command: sh -c "bunx next build && bunx next start -p 3001 -H 0.0.0.0"
    ports:
      - "3001:3001"
    environment:
      NEXT_PUBLIC_API_BASE_URL: https://api.thinks.live
      NEXT_PUBLIC_WS_BASE_URL: wss://ws.thinks.live
    depends_on:
      - backend
      - ws
    restart: unless-stopped

  engine:
    image: jiten56/preps-engine:latest
    ports:
      - "9101:9101"
    environment:
      REDIS_URL: redis://redis:6379
      SNAPSHOT_PATH: /data/snapshot.json
    volumes:
      - engine_data:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  market:
    image: jiten56/preps-market:latest
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
      engine:
        condition: service_started
    restart: unless-stopped

  db_poller:
    image: jiten56/preps-db-poller:latest
    ports:
      - "9103:9103"
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/mydb
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  price_poller:
    image: jiten56/preps-price-poller:latest
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2.11-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - ws
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  engine_data:
  caddy_data:
  caddy_config:
