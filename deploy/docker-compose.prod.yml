services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mydb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    image: jiten56/preps-migrate:latest
    command: sh -c "bunx prisma migrate deploy && bun setup.ts"
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/mydb
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    image: jiten56/preps-backend:latest
    ports:
      - "3000:3000"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/mydb
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  ws:
    image: jiten56/preps-ws:latest
    ports:
      - "9102:9102"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: jiten56/preps-frontend:latest
    command: sh -c "bunx next build && bunx next start -p 3001 -H 0.0.0.0"
    ports:
      - "3001:3001"
    environment:
      NEXT_PUBLIC_API_BASE_URL: https://api.thinks.live
      NEXT_PUBLIC_WS_BASE_URL: wss://ws.thinks.live
    depends_on:
      - backend
      - ws
    restart: unless-stopped

  engine:
    image: jiten56/preps-engine:latest
    ports:
      - "9101:9101"
    environment:
      REDIS_URL: redis://redis:6379
      SNAPSHOT_PATH: /data/snapshot.json
    volumes:
      - engine_data:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  market:
    image: jiten56/preps-market:latest
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
      engine:
        condition: service_started
    restart: unless-stopped

  db_poller:
    image: jiten56/preps-db-poller:latest
    ports:
      - "9103:9103"
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/mydb
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  price_poller:
    image: jiten56/preps-price-poller:latest
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - ws
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  engine_data:
  caddy_data:
  caddy_config:
