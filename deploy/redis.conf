# =============================================================================
# Redis config for a matching-engine deployment on a small VM.
# The whole point of this file is to stop Redis from eating all the RAM and
# OOM-killing the box. Mounted read-only into the redis container.
# =============================================================================

# ---- Hard memory cap --------------------------------------------------------
# Redis will NEVER use more than this. Size it to your VM:
#   run `free -m` on the VM, take total RAM, give Redis ~15-20% of it.
#   1 GB VM  -> 128mb      2 GB VM -> 256mb      4 GB VM -> 512mb
# The container also has its own mem_limit in compose (set a bit above this).
maxmemory 192mb

# ---- Eviction policy: queue-safe --------------------------------------------
# noeviction = when maxmemory is hit, REJECT new writes with an error instead
# of deleting keys or crashing. For a matching engine the lists/streams hold
# ORDERS you must not silently drop, so eviction would be data loss. A rejected
# write is visible backpressure you can see and fix; an OOM crash is not.
#
# >>> Use `allkeys-lru` ONLY if this Redis is a pure cache (safe to drop keys).
maxmemory-policy noeviction

# ---- Persistence / snapshots: the other RAM spike ---------------------------
# Disable RDB snapshots. The periodic BGSAVE forks the process and copy-on-write
# can transiently DOUBLE Redis's memory during the save -- exactly the spike
# that OOMs a small VM. The engine keeps its own snapshot.json on a volume, so
# Redis itself does not need to be durable here.
save ""

# If you DO want Redis persistence, delete the `save ""` line above and instead
# keep snapshots small + don't let a failed fork wedge writes:
#   save 900 1
#   stop-writes-on-bgsave-error no
stop-writes-on-bgsave-error no

# Append-only off: AOF also forks on rewrite and the file grows over time.
# Turn on ONLY if you truly need data to survive a Redis restart.
appendonly no

# ---- Pub/sub buffer cap -----------------------------------------------------
# A slow/dead subscriber otherwise makes Redis buffer undelivered messages in
# RAM without bound. Cap it: if a subscriber's buffer exceeds 32mb (or stays
# above 8mb for 60s), Redis disconnects it instead of ballooning memory.
client-output-buffer-limit pubsub 32mb 8mb 60

# ---- Hygiene ----------------------------------------------------------------
tcp-keepalive 60
# Log memory/eviction events so you can see pressure before it bites.
loglevel notice
